<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Coding Buddy Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hi!</h1>
        <p>Welcome to our contact and coding buddy survey.</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="contactDetails">Contact Details:</label>
                <textarea id="contactDetails" name="contactDetails" rows="4" placeholder="Enter your contact details..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="dogBuddy">Which dog makes the best coding buddy?</label>
                <input type="text" id="dogBuddy" name="dogBuddy" placeholder="e.g., Wilbur">
            </div>
            
            <div class="form-group">
                <label for="catBuddy">Which cat makes the best coding buddy?</label>
                <input type="text" id="catBuddy" name="catBuddy" placeholder="e.g., None">
            </div>
            
            <button type="submit">Submit</button>
        </form>
        
        <div id="results" class="results" style="display: none;">
            <h2>Submitted Information:</h2>
            <div id="submittedData"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
